<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 60px;
            margin-top: 40px;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 40px;
        }

        .shop {
            text-align: center;
        }

        .shop img {
            width: 200px;
        }

        hr {
            width: 100%;
            margin-top: 50px;
        }

        .copyright {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            margin: 10px 20px;
        }
    </style>
</head>
<body>

    <h1>Welcome to my shop !</h1>

    <div class="shops">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
            <br>
            <a href="https://shopee.co.th" target="_blank">Shopee</a>
        </div>

        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Lazada_logo_2021.svg" alt="Lazada">
            <br>
            <a href="https://www.lazada.co.th" target="_blank">Lazada</a>
        </div>
    </div>

    <hr>

    <div class="copyright">
        © rtrachoo 2026
    </div>

</body>
</html>
