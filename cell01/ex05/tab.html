<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th{
            border: 1px solid black;
            border-collapse: collapse;
        }

        th{
            padding: 20px;
        }

        th:first-child{
            background-color: red;
        }

        th:last-child{
            background-color: green;
        }
        
    </style>
</head>
<body>
    <table width="100%">
        <tr>
            <th>First Cell</th>
            <th>Second Cell</th>
        </tr>
    </table>
</body>
</html>
